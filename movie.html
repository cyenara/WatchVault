<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | WatchVault</title>

    <link rel="stylesheet" href="style.css">
    <script src="movie.js" defer></script>
    <script src="auth.js" defer></script>
</head>
<body>

    <header>
        <h1>WatchVault</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#discover">Discover</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="watched.html">Watched</a></li>

                <li class="auth-nav-link">
                    <a href="login.html">Login</a>
                </li>

                <li class="auth-nav-link">
                    <a href="register.html">Register</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="movie-details-page">

        <a class="back-link" href="index.html#discover">
            ← Back to Discover
        </a>
        <div id="details-backdrop" class="details-backdrop" hidden></div>
        <p id="details-status" role="status">Loading movie...</p>

        <section id="movie-details" class="movie-details" hidden>

            <img id="details-poster" class="details-poster" alt="">

            <div class="details-content">

                <h2 id="details-title"></h2>

                <p id="details-meta"></p>

                <p id="details-genres"></p>
                <button id="watchlist-button" type="button" aria-pressed="false">
                    + Add to Watchlist
                </button>

                <button id="watched-button" type="button" aria-pressed="false">
                    ✓ Mark as Watched
                </button>


                <section id="personal-rating-section"
                        class="personal-rating-section"
                        aria-labelledby="personal-rating-title">

                    <h3 id="personal-rating-title">Your Rating</h3>

                    <p id="rating-message" role="status">
                        Loading your rating...
                    </p>

                    <div id="rating-controls" class="rating-controls" hidden>

                        <label for="personal-rating">Rate this movie</label>

                        <select id="personal-rating">
                            <option value="">Choose a rating</option>
                            <option value="10">10 - Masterpiece</option>
                            <option value="9">9 - Amazing</option>
                            <option value="8">8 - Great</option>
                            <option value="7">7 - Good</option>
                            <option value="6">6 - Above Average</option>
                            <option value="5">5 - Average</option>
                            <option value="4">4 - Below Average</option>
                            <option value="3">3 - Poor</option>
                            <option value="2">2 - Bad</option>
                            <option value="1">1 - Terrible</option>
                        </select>

                        <button id="save-rating" type="button">
                            Save Rating
                        </button>

                        <button id="remove-rating" type="button" hidden>
                            Remove Rating
                        </button>

                    </div>
                </section>


                <h3>Overview</h3>
                <p id="details-overview"></p>

                <h3>Director</h3>
                <p id="details-director"></p>

                <h3>Cast</h3>
                <div id="details-cast" class="cast-grid"></div>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 WatchVault</p>
    </footer>

</body>
</html>
